name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  verify-pr:
    name: Verify Plugin & Version

    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          CURRENT_VERSION=$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "❌ Не удалось найти 'version=' в gradle.properties"
            exit 1
          fi
          echo "Текущая версия в gradle.properties: $CURRENT_VERSION"

          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "✅ Тегов еще нет (первый релиз). Проверка пройдена."
            exit 0
          fi

          LATEST_VERSION=${LATEST_TAG#v}
          echo "Последний релизный тег: $LATEST_TAG (версия $LATEST_VERSION)"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "❌ Ошибка: версия не изменилась ($CURRENT_VERSION). Увеличьте version в gradle.properties!"
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$CURRENT_VERSION" | sort -V | tail -n 1)
          if [ "$HIGHEST" != "$CURRENT_VERSION" ]; then
            echo "❌ Ошибка: новая версия ($CURRENT_VERSION) меньше текущей релизной ($LATEST_VERSION)!"
            exit 1
          fi

          echo "✅ Версия корректно увеличена: $LATEST_VERSION -> $CURRENT_VERSION"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Plugin
        run: ./gradlew verifyPlugin